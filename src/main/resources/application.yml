spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    loadbalancer:
      cache:
        ttl: 10s
      configurations: health-check
      health-check:
        interval: 10s
        path:
          default: /actuator/health
        refetch-instances: true

    gateway:
      httpclient:
        ssl:
          use-insecure-trust-manager: true
        connect-timeout: 5000
        pool:
          type: fixed
          eviction-interval: 10
          max-connections: 500
          acquire-timeout: 5
          max-idle-time: 15s
      # 비-CBT CORS 는 기존 와일드카드를 유지한다. CBT 경로는 CbtCorsOriginFilter 가
      # exact origin 및 preflight method/header 계약을 먼저 검증한다.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            # Set-Cookie is a Fetch forbidden response header; listing it here does not make it JS-readable.
            exposed-headers:
              - "Set-Cookie"
      default-filters:
        - AddRequestHeader=X-Request-ID, ${random.uuid}
        - name: AuthenticateGrpcFilter
      routes:
        - id: auth-server-route
          uri: lb://${network.services.auth.name}
          filters:
            - SetRequestHeader=Host, auth.platformholder.site
          predicates:
            - Host=woo-auth.duckdns.org,auth.platformholder.site
        - id: bbr-backend-route
          uri: lb://${network.services.bbr.name}
          predicates:
            - Host=bbr.platformholder.site
        - id: fmp-backend-route
          uri: lb://${network.services.fmp.name}
          predicates:
            - Host=fmp.platformholder.site
        - id: oauth-route
          uri: lb://${network.services.auth.name}
          filters:
            - SetRequestHeader=Host, auth.platformholder.site
          predicates:
            - Path=/api/v1/auth/**, /oauth2/**
          order: -1
        - id: storage-route
          uri: lb://${network.services.storage.name}
          predicates:
            - Host=cdn.platformholder.site
        - id: forest
          uri: lb://${network.services.forest.name}
          predicates:
            - Host=forest.platformholder.site
        - id: mirror-view
          uri: lb://${network.services.mv.name}
          predicates:
            - Host=mirror-view.platformholder.site
        # Swagger API Docs 프록시 라우팅
        - id: swagger-api-docs-bbr
          uri: lb://${network.services.bbr.name}
          predicates:
            - Path=/v3/api-docs/bbr/**
          filters:
            - RewritePath=/v3/api-docs/bbr(?<segment>.*), /v3/api-docs${segment}
        - id: swagger-api-docs-fmp
          uri: lb://${network.services.fmp.name}
          predicates:
            - Path=/v3/api-docs/fmp/**
          filters:
            - RewritePath=/v3/api-docs/fmp(?<segment>.*), /v3/api-docs${segment}
        - id: swagger-api-docs-forest
          uri: lb://${network.services.forest.name}
          predicates:
            - Path=/v3/api-docs/forest/**
          filters:
            - RewritePath=/v3/api-docs/forest(?<segment>.*), /v3/api-docs${segment}
        - id: swagger-api-docs-mv
          uri: lb://${network.services.mv.name}
          predicates:
            - Path=/v3/api-docs/mv/**
          filters:
            - RewritePath=/v3/api-docs/mv(?<segment>.*), /v3/api-docs${segment}
        - id: backoffice
          uri: lb://${network.services.backoffice.name}
          predicates:
            - Host=backoffice.platformholder.site
  #        - id: test
#          uri: grpc://${network.services.auth.host  }:9090
#          predicates:
#            - Path=/test/**
#          filters:
#            - name: CustomJsonToGrpcFilter
#              args:
#                protoDescriptor: classpath:proto/test.pb
#                protoFile: classpath:proto/test.proto
#                service: GrpcTestService
#                method: GrpcTest
  profiles:
    active: dev
network:
  services:
    bbr:
      host: ${BBR_HOST:bbr}
      name: ${BBR_NAME:bbr}
    fmp:
      host: ${FMP_HOST:fmp}
      name: ${FMP_NAME:fmp}
    auth:
      host: ${AUTH_HOST:localhost}
      name: ${AUTH_NAME:auth}
    storage:
      host: ${STORAGE_HOST}
      name: ${STORAGE_NAME}
    forest:
      host: ${FOREST_HOST}
      name: ${FOREST_NAME}
    mv:
      host: ${MV_HOST}
      name: ${MV_NAME}
    backoffice:
      host: ${BACKOFFICE_HOST:backoffice-bff}
      name: ${BACKOFFICE_NAME:backoffice-bff}
    port: ${SERVICE_PORT:8080}
logging:
  level:
    org.woo.gateway: INFO

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    lease-expiration-duration-in-seconds: 20
    lease-renewal-interval-in-seconds: 10

server:
  http2:
    enabled: true
#  port: 8081

# Swagger 설정
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: BBR Service
        url: /v3/api-docs/bbr
      - name: FMP Service
        url: /v3/api-docs/fmp
      - name: Forest Service
        url: /v3/api-docs/forest
      - name: Mirror View Service
        url: /v3/api-docs/mv

gateway:
  auth:
    cookie:
      access-token-name: accessToken
      refresh-token-name: refreshToken
      domain: ${AUTH_COOKIE_DOMAIN:.platformholder.site}
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:None}
      path: /
      http-only: true
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
  # CSRF Origin/Referer 화이트리스트 (OriginVerificationFilter 가 참조).
  # - allowed-host-suffixes: 패밀리 도메인 통째 허용 (서브도메인 와일드카드).
  # - allowed-exact-hosts: vercel preview 등 정확 매칭 (suffix 통째 허용 시 제3자 우회 위험).
  # - allowed-localhost-hosts: 로컬 개발 편의용.
  # 환경별 override 는 ENV(`GATEWAY_SECURITY_CSRF_ALLOWED_EXACT_HOSTS_0` 등) 또는 profile yaml 로.
  security:
    cbt-cors:
      allowed-origins:
        - ${CBT_WEB_ORIGIN:https://mirror-view.platformholder.site}
        - ${CBT_WEB_LOCAL_VITE_ORIGIN:http://localhost:5173}
        - ${CBT_WEB_LOCAL_PREVIEW_ORIGIN:http://127.0.0.1:4173}
    csrf:
      token:
        cookie-name: XSRF-TOKEN
        header-name: X-XSRF-TOKEN
        cookie-domain: ${CSRF_COOKIE_DOMAIN:.platformholder.site}
        secure: ${CSRF_COOKIE_SECURE:true}
        same-site: ${CSRF_COOKIE_SAME_SITE:None}
        path: /
        http-only: false
        bytes: 32
      allowed-host-suffixes:
        - .platformholder.site
      allowed-exact-hosts:
        - forest-front-psi.vercel.app
      allowed-localhost-hosts:
        - localhost
        - 127.0.0.1

grpc:
  client:
    GLOBAL:
      negotiation-type: plaintext
